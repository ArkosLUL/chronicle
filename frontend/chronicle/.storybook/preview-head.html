<!-- Dynamic Google Font loader -->
<script>
(function() {
  const loadedFonts = new Set();
  
  function loadGoogleFont(fontFamily) {
    const fontName = fontFamily.split(',')[0].trim().replace(/["']/g, '');
    const systemFonts = ['ui-sans-serif', 'system-ui', 'sans-serif', 'serif', 'monospace', 'ui-serif', 'ui-monospace'];
    if (systemFonts.some(sf => fontName.toLowerCase().includes(sf.toLowerCase()))) return;
    if (loadedFonts.has(fontName)) return;
    loadedFonts.add(fontName);
    
    const link = document.createElement('link');
    link.href = `https://fonts.googleapis.com/css2?family=${fontName.replace(/ /g, '+')}&display=swap`;
    link.rel = 'stylesheet';
    document.head.appendChild(link);
    console.log('[font-loader] Loaded:', fontName);
  }
  
  const observer = new MutationObserver(() => {
    const style = getComputedStyle(document.documentElement);
    ['--font-sans', '--font-serif', '--font-mono'].forEach(prop => {
      const value = style.getPropertyValue(prop);
      if (value) loadGoogleFont(value);
    });
  });
  
  observer.observe(document.documentElement, { attributes: true, attributeFilter: ['style'] });
})();
</script>

<!-- Tweakcn theme handler (custom implementation to bypass origin check) -->
<script>
(function() {
  function applyThemeStyles(styles, mode) {
    var root = document.documentElement;
    root.classList.toggle('dark', mode === 'dark');
    
    var values = styles.light || {};
    for (var key in values) {
      if (values[key]) root.style.setProperty('--' + key, values[key]);
    }
    
    if (mode === 'dark' && styles.dark) {
      for (var key in styles.dark) {
        if (styles.dark[key]) root.style.setProperty('--' + key, styles.dark[key]);
      }
    }
  }
  
  function sendToParent(data) {
    if (window.parent !== window) {
      window.parent.postMessage(data, '*');
    }
  }
  
  window.addEventListener('message', function(e) {
    var type = e.data && e.data.type;
    if (!type || type.indexOf('TWEAKCN_') !== 0) return;
    
    console.log('[story] received:', type);
    
    switch(type) {
      case 'TWEAKCN_PING':
        sendToParent({ type: 'TWEAKCN_PONG' });
        break;
      case 'TWEAKCN_CHECK_SHADCN':
        sendToParent({ type: 'TWEAKCN_SHADCN_STATUS', payload: { supported: true } });
        break;
      case 'TWEAKCN_THEME_UPDATE':
        var payload = e.data.payload;
        if (payload && payload.themeState) {
          applyThemeStyles(payload.themeState.styles, payload.themeState.currentMode);
          sendToParent({ type: 'TWEAKCN_THEME_APPLIED' });
        }
        break;
    }
  });
  
  sendToParent({ type: 'TWEAKCN_EMBED_LOADED' });
  console.log('[story] tweakcn handler loaded');
})();
</script>
