<!-- Relay tweakcn messages between parent and story iframe -->
<script>
(function() {
  function getStoryIframe() {
    return document.getElementById('storybook-preview-iframe');
  }
  
  function sendToParent(data) {
    if (window.parent !== window) {
      window.parent.postMessage(data, '*');
    }
  }
  
  function sendToStory(data) {
    var iframe = getStoryIframe();
    if (iframe && iframe.contentWindow) {
      iframe.contentWindow.postMessage(data, '*');
    }
  }
  
  window.addEventListener('message', function(e) {
    var type = e.data && e.data.type;
    if (!type || type.indexOf('TWEAKCN_') !== 0) return;
    
    // From parent (tweakcn) -> forward to story
    if (e.source === window.parent) {
      console.log('[manager] -> story:', type);
      sendToStory(e.data);
    }
    // From story iframe -> forward to parent
    else {
      var iframe = getStoryIframe();
      if (iframe && e.source === iframe.contentWindow) {
        console.log('[manager] -> parent:', type);
        sendToParent(e.data);
      }
    }
  });
  
  console.log('[storybook manager] tweakcn relay loaded');
})();
</script>
