name: Deploy to Railway (Manual)

# Manual deployment only - automated deploys on tags go through go-checks.yml
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

# Cancel in-progress runs when a new workflow with the same ref is triggered
concurrency:
  group: railway-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    environment: railway
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Redeploy chronicled on Railway
        # The Railway service is configured to use emyrk/chronicled:latest
        # This triggers a redeploy to pull the latest image from DockerHub
        run: railway redeploy --service chronicled --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
