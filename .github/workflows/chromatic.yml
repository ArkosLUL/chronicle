# Visual regression testing with Chromatic
# Runs on PRs that change frontend code

name: Chromatic

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for Chromatic to compare with base branch

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/chronicle/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend/chronicle

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          workingDir: frontend/chronicle
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Don't fail CI on visual changes - review them in Chromatic UI
          exitZeroOnChanges: true
          # Only run on branches, skip if no changes detected
          onlyChanged: true
          # Build Storybook before running (required)
          buildScriptName: build-storybook
